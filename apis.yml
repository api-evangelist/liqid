aid: liqid
name: LIQID Investments
description: 'LIQID Investments GmbH (Berlin, founded 2016) is one of Europe''s largest
  digital wealth managers, serving affluent private clients with more than EUR 4 billion
  in assets under management and 12,000+ customers. Through its regulated subsidiary
  LIQID Asset Management GmbH — a securities institution supervised by BaFin and the
  Deutsche Bundesbank — it offers digitally delivered discretionary portfolio management
  (LIQID Global, Global Future, Select and Income ETF strategies from EUR 100,000),
  cash management, and access to private markets: Private Markets NXT from EUR 20,000
  and Private Equity PRO / Venture PRO from EUR 200,000 for semi-professional investors.
  Custody sits with V-Bank. LIQID delivers the product through a web dashboard and a
  mobile app, not through a public developer program: it publishes no OpenAPI, no
  developer portal and no SDKs. The public machine-readable surface it does serve is a
  security.txt pointing at a vulnerability disclosure policy and OpenID Connect discovery
  metadata for its Auth0-backed customer login; its own application API at api.liqid.de
  answers 401 on every path.'
